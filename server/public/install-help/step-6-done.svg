<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#C45A72" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#C45A72" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0C0C0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D96C85"/>
      <stop offset="100%" stop-color="#A03A58"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1620"/>
      <stop offset="100%" stop-color="#141419"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#0C0C0F"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- Step badge -->
  <circle cx="540" cy="108" r="32" fill="#C45A72"/>
  <text x="540" y="119" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">6</text>
  <text x="540" y="178" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#F2F2F7" text-anchor="middle">You&apos;re all set</text>

  <!-- Phone body -->
  <rect x="340" y="208" width="400" height="762" rx="58" fill="#16161C" stroke="#2E2E37" stroke-width="3"/>
  <rect x="354" y="222" width="372" height="734" rx="44" fill="url(#wall)"/>

  <!-- Status bar -->
  <text x="384" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#E8E8EE">9:41</text>
  <g fill="#E8E8EE">
    <rect x="664" y="244" width="3" height="6" rx="1"/>
    <rect x="669" y="242" width="3" height="8" rx="1"/>
    <rect x="674" y="240" width="3" height="10" rx="1"/>
    <rect x="679" y="238" width="3" height="12" rx="1"/>
  </g>
  <rect x="694" y="239" width="20" height="11" rx="3" fill="none" stroke="#E8E8EE" stroke-width="1.5"/>
  <rect x="716" y="242" width="3" height="5" rx="1.5" fill="#E8E8EE"/>
  <rect x="697" y="242" width="12" height="5" rx="1.5" fill="#34C759"/>

  <!-- App grid -->
  <g>
    <!-- Row 1 -->
    <g transform="translate(384, 290)">
      <rect width="92" height="92" rx="20" fill="url(#pink)" stroke="#C45A72" stroke-width="2.5"/>
      <text x="46" y="62" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>
      <text x="46" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#F2F2F7" text-anchor="middle">MeetSweet</text>
    </g>
    <g transform="translate(494, 290)">
      <rect width="92" height="92" rx="20" fill="#2A6FDB"/>
      <circle cx="46" cy="46" r="22" fill="#FFFFFF" opacity="0.9"/>
      <path d="M 34 46 l 8 8 l 16 -18" fill="none" stroke="#2A6FDB" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="46" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#E8E8EE" text-anchor="middle">Files</text>
    </g>
    <g transform="translate(604, 290)">
      <rect width="92" height="92" rx="20" fill="#34A853"/>
      <path d="M 46 24 l 22 12 v 20 l -22 12 l -22 -12 v -20 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="46" cy="46" r="8" fill="#FFFFFF"/>
      <text x="46" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#E8E8EE" text-anchor="middle">Chrome</text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(384, 462)">
      <rect width="92" height="92" rx="20" fill="#FBBC05"/>
      <path d="M 30 52 a 16 16 0 1 1 32 0 l -4 14 h -24 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 40 66 h 12" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="46" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#E8E8EE" text-anchor="middle">Photos</text>
    </g>
    <g transform="translate(494, 462)">
      <rect width="92" height="92" rx="20" fill="#EA4335"/>
      <path d="M 46 26 l 22 14 v 22 l -22 14 l -22 -14 v -22 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
      <text x="46" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#E8E8EE" text-anchor="middle">Mail</text>
    </g>
    <g transform="translate(604, 462)">
      <rect width="92" height="92" rx="20" fill="#1A73E8"/>
      <circle cx="46" cy="46" r="24" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <path d="M 46 28 v 18 l 12 7" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="46" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#E8E8EE" text-anchor="middle">Clock</text>
    </g>
  </g>

  <!-- Success toast -->
  <rect x="392" y="600" width="296" height="72" rx="18" fill="#1E1E26" stroke="#2A2A33" stroke-width="1.5"/>
  <circle cx="420" cy="636" r="14" fill="#34C759"/>
  <path d="M 414 636 l 4 4 l 8 -9" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="446" y="630" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F2F2F7">MeetSweet installed</text>
  <text x="446" y="652" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9A9AA8">Tap Open to get started</text>
  <rect x="612" y="616" width="64" height="40" rx="20" fill="#C45A72"/>
  <text x="644" y="641" font-family="Arial, Helvetica, sans-serif" font-size="13.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Open</text>

  <!-- Dock -->
  <rect x="374" y="740" width="332" height="104" rx="28" fill="#1A1A21" stroke="#2A2A33" stroke-width="1.5"/>
  <g transform="translate(424, 766)">
    <rect width="72" height="72" rx="18" fill="url(#pink)"/>
    <text x="36" y="50" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>
  </g>
  <g transform="translate(524, 766)">
    <rect width="72" height="72" rx="18" fill="#2A6FDB"/>
    <path d="M 20 40 a 16 16 0 0 1 32 0 l -3 14 h -26 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
  </g>
  <g transform="translate(624, 766)">
    <rect width="72" height="72" rx="18" fill="#34A853"/>
    <path d="M 36 24 l 22 12 v 20 l -22 12 l -22 -12 v -20 Z" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="36" cy="46" r="8" fill="#FFFFFF"/>
  </g>

  <!-- Gesture pill -->
  <rect x="522" y="928" width="56" height="5" rx="2.5" fill="#3A3A44"/>

  <!-- Caption -->
  <text x="540" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#C45A72" text-anchor="middle">Open MeetSweet, create an account and explore</text>
</svg>
