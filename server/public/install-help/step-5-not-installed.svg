<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#C45A72" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#C45A72" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0C0C0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D96C85"/>
      <stop offset="100%" stop-color="#A03A58"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#0C0C0F"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- Step badge -->
  <circle cx="540" cy="108" r="32" fill="#C45A72"/>
  <text x="540" y="119" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="540" y="178" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" fill="#F2F2F7" text-anchor="middle">&#8220;App not installed&#8221;</text>

  <!-- Phone body -->
  <rect x="340" y="208" width="400" height="762" rx="58" fill="#16161C" stroke="#2E2E37" stroke-width="3"/>
  <rect x="354" y="222" width="372" height="734" rx="44" fill="#131318"/>

  <!-- Status bar -->
  <text x="384" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#E8E8EE">9:41</text>
  <g fill="#E8E8EE">
    <rect x="664" y="244" width="3" height="6" rx="1"/>
    <rect x="669" y="242" width="3" height="8" rx="1"/>
    <rect x="674" y="240" width="3" height="10" rx="1"/>
    <rect x="679" y="238" width="3" height="12" rx="1"/>
  </g>
  <rect x="694" y="239" width="20" height="11" rx="3" fill="none" stroke="#E8E8EE" stroke-width="1.5"/>
  <rect x="716" y="242" width="3" height="5" rx="1.5" fill="#E8E8EE"/>
  <rect x="697" y="242" width="12" height="5" rx="1.5" fill="#34C759"/>

  <!-- Error header -->
  <circle cx="540" cy="318" r="38" fill="#2A2A33"/>
  <text x="540" y="331" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#FF6B6B" text-anchor="middle">!</text>
  <text x="540" y="384" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#F2F2F7" text-anchor="middle">App not installed</text>
  <text x="540" y="410" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9A9AA8" text-anchor="middle">The installation did not complete</text>

  <!-- Checklist card -->
  <rect x="374" y="436" width="332" height="258" rx="20" fill="#1A1A21" stroke="#2A2A33" stroke-width="1.5"/>
  <circle cx="402" cy="468" r="11" fill="none" stroke="#3A3A44" stroke-width="2"/>
  <text x="426" y="473" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#F2F2F7">Allow unknown apps</text>
  <text x="426" y="493" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9A9AA8">Settings → Apps → Special access (Step 4)</text>
  <circle cx="402" cy="530" r="11" fill="none" stroke="#3A3A44" stroke-width="2"/>
  <text x="426" y="535" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#F2F2F7">Free up storage space</text>
  <text x="426" y="555" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9A9AA8">Delete unused apps or files</text>
  <circle cx="402" cy="592" r="11" fill="none" stroke="#3A3A44" stroke-width="2"/>
  <text x="426" y="597" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#F2F2F7">Re-download the APK</text>
  <text x="426" y="617" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9A9AA8">The file may be incomplete — get it again</text>
  <circle cx="402" cy="654" r="11" fill="none" stroke="#3A3A44" stroke-width="2"/>
  <text x="426" y="659" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#F2F2F7">Then tap the APK again</text>
  <text x="426" y="679" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9A9AA8">In Downloads or your file manager</text>

  <!-- Buttons -->
  <rect x="374" y="716" width="156" height="52" rx="26" fill="#C45A72"/>
  <text x="452" y="748" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Try again</text>
  <rect x="550" y="716" width="156" height="52" rx="26" fill="none" stroke="#3A3A44" stroke-width="1.5"/>
  <text x="628" y="748" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="600" fill="#9A9AA8" text-anchor="middle">Open guide</text>

  <!-- Gesture pill -->
  <rect x="522" y="928" width="56" height="5" rx="2.5" fill="#3A3A44"/>

  <!-- Caption -->
  <text x="540" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#C45A72" text-anchor="middle">Fix the checklist, then tap the APK again</text>
</svg>
