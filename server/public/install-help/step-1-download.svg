  <text x="428" y="640" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#F2F2F7">meetsweet.apk</text>
  <text x="428" y="662" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9A9AA8">Download complete · 24 MB</text>
