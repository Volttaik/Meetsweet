<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#C45A72" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#C45A72" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0C0C0F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D96C85"/>
      <stop offset="100%" stop-color="#A03A58"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#0C0C0F"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- Step badge -->
