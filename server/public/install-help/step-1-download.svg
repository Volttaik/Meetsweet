  </g>
  <rect x="694" y="239" width="20" height="11" rx="3" fill="none" stroke="#E8E8EE" stroke-width="1.5"/>
  <rect x="716" y="242" width="3" height="5" rx="1.5" fill="#E8E8EE"/>
  <rect x="697" y="242" width="12" height="5" rx="1.5" fill="#34C759"/>

  <!-- Browser address bar -->
  <rect x="374" y="276" width="332" height="44" rx="22" fill="#1E1E26"/>
  <circle cx="398" cy="298" r="7" fill="none" stroke="#8E8E9C" stroke-width="2"/>
  <text x="470" y="303" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#B9B9C6" text-anchor="middle">meetsweet.space</text>
  <path d="M 660 292 h 18 M 666 288 l 6 6 l 6 -6" fill="none" stroke="#8E8E9C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Landing page card -->
  <rect x="374" y="336" width="332" height="264" rx="20" fill="#1A1A21" stroke="#2A2A33" stroke-width="1.5"/>
  <circle cx="540" cy="380" r="26" fill="url(#pink)"/>
  <text x="540" y="390" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">M</text>
  <text x="540" y="428" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#F2F2F7" text-anchor="middle">MeetSweet</text>
  <text x="540" y="452" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#9A9AA8" text-anchor="middle">Android app · 24 MB</text>
  <rect x="396" y="472" width="288" height="50" rx="25" fill="#C45A72"/>
  <text x="540" y="503" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Download for Android</text>
  <text x="540" y="560" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6E6E7C" text-anchor="middle">meetsweet.space</text>

