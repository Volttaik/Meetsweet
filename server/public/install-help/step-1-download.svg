  <text x="643" y="653" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Open</text>

  <!-- Chrome warning dialog -->
  <rect x="354" y="222" width="372" height="734" rx="44" fill="#000000" opacity="0.55"/>
  <rect x="392" y="400" width="296" height="256" rx="24" fill="#232329" stroke="#34343E" stroke-width="1.5"/>
  <text x="424" y="440" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#F2F2F7">This type of file can</text>
