  <text x="424" y="494" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B9B9C6">If you download this file, you</text>
  <text x="424" y="512" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#B9B9C6">may be putting your device at risk.</text>
  <rect x="424" y="568" width="116" height="46" rx="23" fill="none" stroke="#3A3A44" stroke-width="1.5"/>
  <text x="482" y="596" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="600" fill="#9A9AA8" text-anchor="middle">Discard</text>
  <rect x="556" y="568" width="100" height="46" rx="23" fill="#C45A72"/>
  <text x="606" y="596" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">Keep</text>

  <!-- Gesture pill -->
  <rect x="522" y="928" width="56" height="5" rx="2.5" fill="#3A3A44"/>

  <!-- Caption -->
  <text x="540" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#C45A72" text-anchor="middle">Tap KEEP, then OPEN the downloaded file</text>
