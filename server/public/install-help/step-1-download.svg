  <text x="540" y="119" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="540" y="178" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#F2F2F7" text-anchor="middle">Download the APK</text>

  <!-- Phone body -->
  <rect x="340" y="208" width="400" height="762" rx="58" fill="#16161C" stroke="#2E2E37" stroke-width="3"/>
  <rect x="354" y="222" width="372" height="734" rx="44" fill="#131318"/>

  <!-- Status bar -->
  <text x="384" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#E8E8EE">9:41</text>
  <g fill="#E8E8EE">
    <rect x="664" y="244" width="3" height="6" rx="1"/>
