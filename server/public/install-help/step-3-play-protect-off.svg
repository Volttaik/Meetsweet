<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#C45A72" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#C45A72" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0C0C0F" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="#0C0C0F"/>
  <rect width="1080" height="1080" fill="url(#glow)"/>

  <!-- Step badge -->
  <circle cx="540" cy="108" r="32" fill="#C45A72"/>
  <text x="540" y="119" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="540" y="178" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700" fill="#F2F2F7" text-anchor="middle">Turn off Play Protect</text>

  <!-- Phone body -->
  <rect x="340" y="208" width="400" height="762" rx="58" fill="#16161C" stroke="#2E2E37" stroke-width="3"/>
  <rect x="354" y="222" width="372" height="734" rx="44" fill="#131318"/>

  <!-- Status bar -->
  <text x="384" y="252" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#E8E8EE">9:41</text>
  <g fill="#E8E8EE">
    <rect x="664" y="244" width="3" height="6" rx="1"/>
    <rect x="669" y="242" width="3" height="8" rx="1"/>
    <rect x="674" y="240" width="3" height="10" rx="1"/>
    <rect x="679" y="238" width="3" height="12" rx="1"/>
  </g>
  <rect x="694" y="239" width="20" height="11" rx="3" fill="none" stroke="#E8E8EE" stroke-width="1.5"/>
  <rect x="716" y="242" width="3" height="5" rx="1.5" fill="#E8E8EE"/>
  <rect x="697" y="242" width="12" height="5" rx="1.5" fill="#34C759"/>

  <!-- App bar -->
  <path d="M 388 296 l 10 -10 l 10 10" fill="none" stroke="#E8E8EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="540" y="303" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#F2F2F7" text-anchor="middle">Play Protect</text>

  <!-- Certification card -->
  <rect x="374" y="330" width="332" height="116" rx="18" fill="#1A1A21" stroke="#2A2A33" stroke-width="1.5"/>
  <circle cx="406" cy="388" r="26" fill="#4A9DFF"/>
  <path d="M 406 372 L 424 380 L 424 394 C 424 405 416 415 406 420 C 396 415 388 405 388 394 L 388 380 Z" fill="#FFFFFF" opacity="0.25"/>
  <path d="M 397 388 L 404 395 L 415 383" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="448" y="378" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#F2F2F7">Play Protect</text>
  <text x="448" y="402" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9A9AA8">Device certified</text>
  <text x="448" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#34C759">No harmful apps found</text>

  <!-- Section label -->
  <text x="388" y="478" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600" fill="#9A9AA8">PLAY PROTECT SCANNING</text>

  <!-- Toggle card -->
  <rect x="374" y="494" width="332" height="92" rx="18" fill="#1A1A21" stroke="#2A2A33" stroke-width="1.5"/>
  <text x="396" y="530" font-family="Arial, Helvetica, sans-serif" font-size="15.5" font-weight="700" fill="#F2F2F7">Scan apps with Play Protect</text>
  <text x="396" y="554" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9A9AA8">Get alerts about harmful apps</text>
  <rect x="630" y="518" width="54" height="32" rx="16" fill="#3A3A44"/>
  <circle cx="646" cy="534" r="12" fill="#C9C9D4"/>

  <!-- Warning note -->
  <rect x="374" y="604" width="332" height="130" rx="18" fill="#1A1A21" stroke="#8A5A1F" stroke-width="1.5"/>
  <circle cx="406" cy="642" r="16" fill="#F5A623"/>
  <text x="406" y="649" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#141414" text-anchor="middle">!</text>
  <text x="436" y="632" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F2F2F7">Only if Play Protect blocks</text>
  <text x="436" y="652" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#F2F2F7">the install.</text>
  <text x="436" y="680" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9A9AA8">Turn it back on after installing</text>
  <text x="436" y="698" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#9A9AA8">to keep your device protected.</text>

  <!-- Gesture pill -->
  <rect x="522" y="928" width="56" height="5" rx="2.5" fill="#3A3A44"/>

  <!-- Caption -->
  <text x="540" y="1018" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" fill="#C45A72" text-anchor="middle">Play Store → profile → Play Protect → turn OFF scanning</text>
</svg>
